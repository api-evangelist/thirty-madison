name: Thirty Madison
description: 'Thirty Madison is a US direct-to-consumer telehealth and digital-health company founded
  in 2017 and headquartered in New York City. It operates a family of condition-focused virtual care
  brands, including Keeps (hair loss), Cove (migraine), Facet (dermatology), and Nurx (sexual and
  reproductive health), pairing online medical consultations with mail-order pharmacy fulfillment; the
  company merged with Nurx in 2022. Thirty Madison publishes no public developer API program, so this
  profile captures its public security-disclosure and domain-security posture rather than API artifacts.'
